<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Splitcasts{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v=7">
</head>
<body>
  <div class="wrap">
    {% if request.session.get("auth") %}
    <div class="top">
      <a class="brand" href="/">Splitcasts</a>
      <div class="row">
        <a class="btn secondary" href="/feeds/new">Neuer Feed</a>
        <form method="post" action="/logout"><button class="secondary" type="submit">Logout</button></form>
      </div>
    </div>
    {% endif %}
    {% if flash %}
      <div class="flash {% if flash_error %}error{% endif %}">{{ flash }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </div>
  <script>
    document.addEventListener("click", async (event) => {
      const btn = event.target.closest(".copy-btn");
      if (!btn) return;
      const value = btn.getAttribute("data-copy") || "";
      const label = btn.getAttribute("data-label") || "Kopieren";
      try {
        await navigator.clipboard.writeText(value);
        btn.textContent = "Kopiert";
        setTimeout(() => { btn.textContent = label; }, 1500);
      } catch (err) {
        window.prompt("URL kopieren:", value);
      }
    });
  </script>
</body>
</html>
