[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apofika"
version = "0.1.0"
description = "Add chapter markers to Apokalypse & Filterkaffee episodes via jingle detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0.11",
  "httpx>=0.27.0",
  "numpy>=1.26.0",
  "scipy>=1.11.0",
  "librosa>=0.10.2",
  "soundfile>=0.12.1",
  "mutagen>=1.47.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "typer>=0.12.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.1.0",
]

[project.scripts]
apofika = "apofika.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apofika = ["templates/*.html", "static/*"]
